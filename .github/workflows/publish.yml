name: Publish to npm (Trusted Publishing)

# 触发: 推送 v* 版本标签（git tag v0.1.2 && git push origin v0.1.2）
# 原理: GitHub OIDC -> npm 信任发布，无需令牌、无需 2FA
# 前置条件(必做一次): npmjs.com 为 arktsup 配置 Trusted Publishing，
#   关联本仓库 YangZiCong2503416920/ArkTSUp 与本 workflow(publish.yml)
# 说明: 若 package.json 版本已存在于 registry（如手动发过），自动跳过发布，保持 CI 绿。

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # 关键：OIDC 令牌
      contents: read
    steps:
      - uses: actions/checkout@v5
      # 注意: OIDC 专用 workflow 不要给 setup-node 配 registry-url，
      # 否则会写入占位 _authToken 遮蔽 OIDC 交换，导致 404 (npm/cli#8730, actions/setup-node#1477)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: 检查版本是否已发布（幂等保护）
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view arktsup@$VERSION version 2>/dev/null | grep -q "$VERSION"; then
            echo "版本 $VERSION 已在 registry 上，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted Publishing：npm 自动用 OIDC 换取发布令牌，无需 NODE_AUTH_TOKEN
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance
