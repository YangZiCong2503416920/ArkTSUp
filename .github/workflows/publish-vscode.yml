name: Publish VS Code Extension (Marketplace)

# 触发: 推送 vscode-v* 版本标签（如 git tag vscode-v0.2.0 && git push origin vscode-v0.2.0）
# 说明: 本 workflow 需要发布凭据；不上 CI 也可用网页上传（见 docs/RELEASE.md 2.3，无需任何令牌）。
# 凭据两种方案任选其一（推荐 Entra ID；PAT 已于 2026-12-01 被 Azure DevOps 停用）:
#   A) Entra ID（官方长期方案，无需 PAT）:
#      按官方文档配置 Azure DevOps 服务连接(Workload Identity Federation) + Azure 托管身份 +
#      发布者成员(Contributor)，CI 中用 vsce publish --azure-credential
#      https://code.visualstudio.com/api/working-with-extensions/publishing-extension
#   B) PAT（2026-12-01 前仍可用）:
#      1) 在 https://marketplace.visualstudio.com/manage 创建发布者 yanceecha
#      2) 生成 PAT（Marketplace: Manage 权限）: https://marketplace.visualstudio.com/manage/publishers/yanceecha/pat
#      3) 把 PAT 写入仓库 Secrets，名称必须为 VSCE_PAT
# 版本号取 plugin/package.json；--skip-duplicate 保证已发布的版本自动跳过，CI 保持绿。

on:
  push:
    tags: ['vscode-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 1) 构建根项目 CLI，供插件 copy-lib 打包进 .vsix
      - name: Build arktsup CLI
        run: |
          npm ci
          npm run build

      # 2) 编译插件 + 生成 .vsix（vsce 自带发布前校验）
      - name: Build & package extension
        working-directory: plugin
        run: |
          npm ci
          npm run package

      # 3) 发布到 VS Code Marketplace
      - name: Publish to Marketplace
        working-directory: plugin
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath arktsup-vscode.vsix --skip-duplicate
