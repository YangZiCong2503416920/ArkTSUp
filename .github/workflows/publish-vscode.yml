name: Publish VS Code Extension (Marketplace)

# 触发: 推送 vscode-v* 版本标签（如 git tag vscode-v0.2.1 && git push origin vscode-v0.2.1）
# 说明: 本 workflow 需要发布凭据；不上 CI 也可用网页上传（见 docs/RELEASE.md 2.3，无需任何令牌）。
# 凭据两种方案任选其一，配好后 push 标签即自动上架；都没配则跳过发布（不报红）:
#
#   A) Entra ID（官方长期方案，无需 PAT，推荐）—— 仓库 Secrets 需配置:
#      AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#      配置步骤见 docs/RELEASE.md §2.4-A（Azure DevOps 服务连接 + 托管身份 + 发布者成员）
#      CI 中 azure/login (OIDC) -> vsce publish --azure-credential（需 vsce >= 2.26.1）
#
#   B) PAT（2026-12-01 被 Azure DevOps 停用前仍可用）—— 仓库 Secrets 需配置 VSCE_PAT:
#      生成 PAT（Marketplace: Manage 权限）: https://marketplace.visualstudio.com/manage/publishers/yanceecha/pat
#
# 版本号取 plugin/package.json；--skip-duplicate 保证已发布的版本自动跳过，CI 保持绿。

on:
  push:
    tags: ['vscode-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # azure/login (OIDC) 需要
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 1) 构建根项目 CLI，供插件 copy-lib 打包进 .vsix
      - name: Build arktsup CLI
        run: |
          npm ci
          npm run build

      # 2) 编译插件 + 生成 .vsix（vsce 自带发布前校验）
      - name: Build & package extension
        working-directory: plugin
        run: |
          npm ci
          npm run package

      # 3a) 方案 A：Entra ID 身份登录（OIDC）
      - name: Azure login (Entra ID)
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3b) 方案 A：vsce 使用 Entra ID 凭据发布
      - name: Publish via Entra ID (--azure-credential)
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        working-directory: plugin
        run: npx --yes @vscode/vsce publish --packagePath arktsup-vscode.vsix --azure-credential --skip-duplicate

      # 3c) 方案 B：PAT 发布
      - name: Publish via PAT
        if: ${{ secrets.AZURE_CLIENT_ID == '' && secrets.VSCE_PAT != '' }}
        working-directory: plugin
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath arktsup-vscode.vsix --skip-duplicate

      # 3d) 未配置任何凭据：跳过发布并提示（保持 CI 绿）
      - name: Skip publish (no credentials configured)
        if: ${{ secrets.AZURE_CLIENT_ID == '' && secrets.VSCE_PAT == '' }}
        run: echo "::warning::未配置发布凭据（AZURE_CLIENT_ID 或 VSCE_PAT），跳过发布。请按 docs/RELEASE.md §2.4 配置，或改用网页上传（§2.3）。"
